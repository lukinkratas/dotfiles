#cloud-config
users:
  - name: dev
    groups:
      - sudo
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFoE2xBW8OMZPWLS7Eii86caJ2/KKL4djgcS8yScz+Db

# ssh_pwauth: false set in write_files
disable_root: true

package_update: true
package_upgrade: true
packages:
  - ufw
  - fail2ban
  - git
  - curl
  - python3
  - unzip
  - ca-certificates
  - build-essential
  - ripgrep
  - fzf
  - bat
  - stow
  - lazygit
  - tree
  - ffmpeg
  - jq
  - pre-commit
  - gh
  - neovim
  - uv
  - node
  - bun
  - go
  - awscli
  - gcloud-cli
  - hcloud
  - databricks
  - terraform
  - herdr
  - hunk
  - ollama
  - docker
  - codex
  - claude-code
  - pi-coding-agent

write_files:
  - path: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      Port 2222
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      MaxAuthTries 2
      AllowTcpForwarding no
      X11Forwarding no
      AllowAgentForwarding no
      AuthorizedKeysFile .ssh/authorized_keys
      AllowUsers dev
  - path: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = 2222
      backend = systemd
      banaction = iptables-multiport

runcmd:
  - systemctl enable fail2ban
  - ufw allow 2222/tcp
  - ufw --force enable
  - git clone https://github.com/lukinkratas/dotfiles $HOME/dotfiles
  - stow --target=$HOME --ignore='.*\.example' --verbose --no-folding \
    zsh ghostty nvim oh-my-posh lazygit claude pi herdr
  # set hunk as git diff pager
  - git config --global core.pager "hunk pager"
  # install herdr-auto-title plugin https://github.com/kryptamine/herdr-auto-title
  - herdr plugin install kryptamine/herdr-auto-title
  - herdr plugin action invoke herdr.auto-title.restart
  # add cc plugins
  # databricks skills https://github.com/databricks/databricks-agent-skills/tree/main
  - claude plugin install databricks@databricks-agent-skills
  # Matt Pocock skills https://github.com/mattpocock/skills
  - claude plugin install mattpocock-skills@claude-plugins-official
  # add pi extenstions
  - pi install npm:pi-web-access

final_message: "devbox ready after $UPTIME s"

power_state:
  mode: reboot
  condition: true
