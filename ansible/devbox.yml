---
- name: Hetzner devbox setup
  hosts: devbox
  gather_facts: true # python3 is installed by cloud-init

  handlers:
    - name: Restart herdr auto-title
      ansible.builtin.command: herdr plugin action invoke herdr.auto-title.restart
      changed_when: true

  tasks:
    - name: Install apt packages
      become: true
      ansible.builtin.apt:
        name:
          - unzip
          - ca-certificates
          - build-essential
          - ripgrep
          - fzf
          - bat
          - stow
          - lazygit
          - tree
          - ffmpeg
          - jq
          - pre-commit
          - gh
          - neovim
          - uv
          - node
          - bun
          - go
          - awscli
          - gcloud-cli
          - hcloud
          - databricks
          - terraform
          - herdr
          - hunk
          - ollama
          - docker
          - codex
          - claude-code
          - pi-coding-agent
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Clone dotfiles
      ansible.builtin.git:
        repo: https://github.com/lukinkratas/dotfiles.git
        dest: "{{ ansible_env.HOME }}/dotfiles"
        update: true

    - name: Stow packages
      ansible.builtin.command:
        cmd: >
          stow --verbose --no-folding --target={{ lookup('env', 'HOME') }} --ignore='.*\.example'
          zsh ghostty nvim oh-my-posh lazygit claude pi herdr
        chdit: "{{ ansible_env.HOME }}/dotfiles"

    - name: Use hunk as git pager
      community.general.git_config:
        name: core.pager
        value: hunk pager
        scope: global

    - name: Install herdr plugins
      ansible.builtin.command: herdr plugin install kryptamine/herdr-auto-title
      notify: Restart herdr auto-title

    - name: Install Claude plugins
      ansible.builtin.command: "claude plugin install {{ item }}"
      loop:
        - databricks@databricks-agent-skills
        - mattpocock-skills@claude-plugins-official

    - name: Install Pi extensions
      ansible.builtin.command: pi install npm:pi-web-access
