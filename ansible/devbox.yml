
- name: Hetzner devbox setup
  hosts: devbox
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  handlers:
    - name: Restart herdr auto-title
      ansible.builtin.command: herdr plugin action invoke herdr.auto-title.restart
      changed_when: true

  tasks:
    - name: Add HashiCorp GPG key
      become: true
      ansible.builtin.get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /etc/apt/keyrings/hashicorp.asc
        mode: "0644"

    - name: Add HashiCorp apt repo
      become: true
      ansible.builtin.deb822_repository:
        name: hashicorp
        types: deb
        uris: https://apt.releases.hashicorp.com
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
        signed_by: https://apt.releases.hashicorp.com/gpg
        state: present

    - name: Install apt packages
      become: true
      ansible.builtin.apt:
        name:
          - build-essential
          - unzip
          - ca-certificates
          - git
          - stow
          - ripgrep
          - fzf
          - bat
          - lazygit
          - tree
          - ffmpeg
          - jq
          - pre-commit
          - gh
          - neovim
          - nodejs
          - npm
          - golang-go
          - hcloud-cli
          - zsh
          - terraform
          # bun
          # awscli
          # gcloud-cli
          # hcloud
          # docker
          # ollama
          # codex
          # claude-code
          # antigravity-cli
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install uv
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -LsSf https://astral.sh/uv/install.sh | sh
        executable: /bin/bash
        creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/uv"
      environment:
        UV_NO_MODIFY_PATH: "1"

    - name: Install oh-my-posh
      ansible.builtin.shell:
        cmd: >
          set -o pipefail &&
          curl -fsSL https://ohmyposh.dev/install.sh |
          bash -s -- -d {{ ansible_facts['env']['HOME'] }}/.local/bin
        executable: /bin/bash
        creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/oh-my-posh"

    - name: hunk
      block:
        - name: Install hunk
          ansible.builtin.shell:
            cmd: set -o pipefail && curl -fsSL https://hunk.dev/install.sh | sh
            executable: /bin/bash
            creates: "{{ ansible_facts['env']['HOME'] }}/.hunk/bin/hunk"
          environment:
            HUNK_NO_MODIFY_PATH: "1"

        - name: Use hunk as git pager
          community.general.git_config:
            name: core.pager
            value: hunk pager
            scope: global

    - name: herdr
      block:
        - name: Install herdr
          ansible.builtin.shell:
            cmd: set -o pipefail && curl -fsSL https://herdr.dev/install.sh | sh
            executable: /bin/bash
            creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/herdr"

        # - name: Install herdr plugins
        #   ansible.builtin.command: "herdr plugin install {{ item }}"
        #   loop: 
        #     - kryptamine/herdr-auto-title
        #     - voice0726/herdr-jump-number
        #   notify: Restart herdr auto-title

    # - name: pi
    #   block:
    #     - name: Install pi
    #       ansible.builtin.shell:
    #         cmd: set -o pipefail && curl -fsSL https://pi.dev/install.sh | sh
    #         executable: /bin/bash
    #
    #     - name: Install Pi extensions
    #       ansible.builtin.command: "pi install {{ item }}"
    #       loop:
    #         - npm:pi-web-access

    - name: Set zsh as default shell
      become: true
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        shell: /usr/bin/zsh

    - name: Clone dotfiles
      ansible.builtin.git:
        repo: https://github.com/lukinkratas/dotfiles.git
        dest: "{{ ansible_facts['env']['HOME'] }}/dotfiles"
        update: true

    - name: Stow packages
      ansible.builtin.command:
        cmd: >
          stow --verbose --no-folding --target={{ ansible_facts['env']['HOME'] }} --ignore='.*\.example'
          oh-my-posh zsh nvim lazygit
        chdir: "{{ ansible_facts['env']['HOME'] }}/dotfiles"
      register: stow
      changed_when: "'LINK' in stow.stderr"
