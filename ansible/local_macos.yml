---
- name: Local MacOS Setup
  hosts: localhost
  connection: local
  gather_facts: false

  handlers:
    - name: Restart herdr auto-title
      ansible.builtin.command: herdr plugin action invoke herdr.auto-title.restart
      changed_when: true

  environment:
    PATH: "/opt/homebrew/bin:{{ lookup('env', 'PATH') }}"

  tasks:
    - name: Add taps
      community.general.homebrew_tap:
        name:
          - jandedobbeleer/oh-my-posh
          - oven-sh/bun
          - databricks/tap
          - hashicorp/tap
        state: present

    - name: Install formulae
      community.general.homebrew:
        name:
          - ripgrep
          - fzf
          - bat
          - stow
          - zsh-syntax-highlighting
          - jandedobbeleer/oh-my-posh/oh-my-posh
          - lazygit
          - tree
          - ffmpeg
          - pre-commit
          - gh
          - neovim
          - uv
          - node
          - oven-sh/bun/bun
          - go
          - awscli
          - hcloud
          - databricks/tap/databricks
          - hashicorp/tap/terraform
          - herdr
          - hunk
          - pi-coding-agent
        state: present
        update_homebrew: true

    - name: Install casks
      community.general.homebrew_cask:
        name:
          - google-chrome
          - ghostty
          - docker-desktop
          - obsidian
          - slack
          - dbeaver-community
          - visual-studio-code
          - bruno
          - ollama-app
          - codex
          - claude
          - claude-code
          - gcloud-cli
          - font-0xproto-nerd-font
          - font-ubuntu-mono-nerd-font
          - font-hack-nerd-font
          - font-jetbrains-mono-nerd-font
        state: present

    - name: Clone dotfiles
      ansible.builtin.git:
        repo: https://github.com/lukinkratas/dotfiles.git
        dest: "{{ lookup('env', 'HOME') }}/dotfiles"
        update: true

    - name: Stow packages
      ansible.builtin.command:
        cmd: >
          stow --verbose --no-folding --target={{ lookup('env', 'HOME') }} --ignore='.*\.example'
          zsh ghostty nvim oh-my-posh lazygit claude pi herdr
        chdir: "{{ lookup('env', 'HOME') }}/dotfiles"

    - name: Use hunk as git pager
      community.general.git_config:
        name: core.pager
        value: hunk pager
        scope: global

    - name: Install herdr plugins
      ansible.builtin.command: herdr plugin install kryptamine/herdr-auto-title

    - name: Add Claude plugin marketplaces
      ansible.builtin.command: claude plugin marketplace add databricks/databricks-agent-skills

    - name: Install Claude plugins
      ansible.builtin.command: "claude plugin install {{ item }}"
      loop:
        - databricks@databricks-agent-skills
        - mattpocock-skills@claude-plugins-official

    - name: Install Pi extensions
      ansible.builtin.command: pi install npm:pi-web-access
