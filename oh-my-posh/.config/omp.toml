console_title_template = "{{ .Shell }} in {{ .Folder }}"
version = 4
final_space = true

[palette]
  info = "#2CAAFF"
  success = "#59C9A5"
  warning = "#F3AE35"
  danger = "#D81E5B"

[upgrade]
  source = "cdn"
  interval = "168h"
  auto = false
  notice = false

[[blocks]]
  type = "prompt"
  alignment = "left"

  [[blocks.segments]]
    type = "status"
    template = " {{ if gt .Code 0 }}{{ else }}{{ end }}"
    foreground = "p:success"
    foreground_templates = ["{{ if gt .Code 0 }}p:danger{{ end }}"]

    [blocks.segments.options]
      always_enabled = true

  [[blocks.segments]]
    type = "executiontime"
    foreground = "p:info"
    template = " {{ .FormattedMs }}"

    [blocks.segments.options]
      threshold = 100
      style = "austin"

  [[blocks.segments]]
    type = "path"
    template = " {{ path .Path .Location }}"
    foreground = "p:info"

    [blocks.segments.options]
      style = "full"

  [[blocks.segments]]
    type = "git"
    template = " git:{{.User.Email}} [{{ .HEAD }}{{ if or (.Working.Changed) (.Staging.Changed) }}*{{ end }}]"
    foreground = "p:success"
    foreground_templates = [
      "{{ if or (.Working.Changed) (.Staging.Changed) }}p:warning{{ end }}",
      "{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:danger{{ end }}"
    ]

    [blocks.segments.options]
      branch_icon = ""
      fetch_status = true
      fetch_upstream_icon = false
      fetch_user = true

[[blocks]]
  type = "rprompt"
  alignment = "right"

  [[blocks.segments]]
    type = "aws"
    foreground = "#FF9900"
    template = " aws:{{.Profile}}{{if .Region}}@{{.Region}}{{end}}"

  [[blocks.segments]]
    type = "gcp"
    foreground = "#4285F4"
    template = " gcp:{{ .Project }}"

