harness:
  default: claude-sdk

providers:
  # Subscriptions
  # Prereq: `claude auth login --claudeai` + `codex login`
  # or: `omni setup` → Subscription
  claude:
    kind: subscription
    cli: claude               # Claude Pro/Max → claude-sdk / claude-native harnesses
    default: true             # default for the anthropic family
  codex:
    kind: subscription
    cli: codex                # ChatGPT plan → codex harness
    default: openai           # default for the openai family

  # API-key gateways
  # Gemini: easiest `omni setup` → Antigravity → Configure native agy API key → Gemini — API key
  gemini:
    kind: key
    default: [gemini]
    gemini:
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      api_key: $GEMINI_API_KEY

  deepseek:
    kind: gateway
    openai:
      base_url: https://api.deepseek.com/v1
      api_key_ref: env:DEEPSEEK_API_KEY
      wire_api: chat
      models:
        default: deepseek-v4.1-flash

  nvidia:
    kind: gateway
    openai:
      base_url: https://integrate.api.nvidia.com/v1
      api_key_ref: env:NVIDIA_API_KEY
      wire_api: chat
      models:
        default: moonshotai/kimi-k3.1-pro

  openrouter:                 # optional: any model via one key
    kind: gateway
    anthropic:                # Claude Code → Anthropic-compatible root
      base_url: https://openrouter.ai/api
      api_key_ref: env:OPENROUTER_API_KEY
    openai:                   # Codex / Pi → OpenAI-compatible root
      base_url: https://openrouter.ai/api/v1
      api_key_ref: env:OPENROUTER_API_KEY
      wire_api: chat
