providers:
  claude:
    cli: claude
    default: true
    kind: subscription

  codex:
    cli: codex
    kind: subscription

  deepseek:
    kind: gateway
    openai:
      base_url: https://api.deepseek.com/v1
      api_key_ref: env:DEEPSEEK_API_KEY
      wire_api: chat
      models:
        default: deepseek-v4.1-flash
      pricing:
        input_per_million: 0.30
        output_per_million: 1.20

  nvidia:
    kind: gateway
    openai:
      base_url: https://integrate.api.nvidia.com/v1
      api_key_ref: env:NVIDIA_API_KEY
      wire_api: chat
      models:
        default:       mistralai/mistral-large-4-1t-a52b   # Mistral Large 4 (default)
        minimax-flash: minimaxai/minimax-m3.1-flash        # MiniMax M3.1 Flash
        step5:         stepfun-ai/step-5-preview           # Step 5 Preview
        glm-flash:     z-ai/glm-5.3-flash                  # GLM-5.3 Flash   ⚠ verify id
        deepseek:      deepseek-ai/deepseek-v4.1-flash     # DeepSeek V4.1 Flash ⚠ verify id
      pricing: 
      pricing:
        input_per_million: 0.0
        output_per_million: 0.0
